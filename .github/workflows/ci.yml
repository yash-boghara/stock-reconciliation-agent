name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # The baseline is pinned in the suite above, so a drift fails the
      # build. Printing it here means the number is visible in the log of
      # every run rather than something you have to reproduce locally to
      # find out.
      - name: Report baseline
        run: |
          python -m src.recon.generate
          python -m src.recon.evaluate
